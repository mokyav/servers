name: Koruva CI

on:
  pull_request:
    paths:
      - "koruva/**"
      - ".github/workflows/koruva-ci.yml"
  push:
    branches:
      - main
    paths:
      - "koruva/**"
      - ".github/workflows/koruva-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koruva
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: koruva/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Run automated tests
        run: npm test
