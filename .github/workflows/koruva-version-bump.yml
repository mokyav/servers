name: Koruva automatic version bump

on:
  push:
    branches:
      - main
    paths:
      - "koruva/**"
      # A commit that only updates the package version must not trigger another bump.
      - "!koruva/package.json"
      - "!koruva/package-lock.json"
      # Test-only updates do not change the game release version.
      - "!koruva/test/**"
      # AI coordination notes are documentation, not game releases.
      - "!koruva/AI_COORDINATION_*.md"

permissions:
  contents: write

concurrency:
  group: koruva-version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Increment Koruva minor version
        working-directory: koruva
        run: npm version minor --no-git-tag-version

      - name: Commit and push version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koruva/package.json koruva/package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit"
            exit 0
          fi
          VERSION=$(node -p "require('./koruva/package.json').version")
          git commit -m "chore(koruva): bump game version to ${VERSION}"
          git push origin main
